<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">The Work Automation pull request pipeline</title>
  <desc id="desc">A work item moves through research, planning, independent review, implementation, validation, pull request creation, build watching, and a post-mortem.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8fa"/>
      <stop offset="1" stop-color="#eef3f8"/>
    </linearGradient>
    <linearGradient id="start" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0969da"/>
      <stop offset="1" stop-color="#0550ae"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1f2328" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect width="1200" height="620" rx="30" fill="url(#background)"/>
  <text x="600" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#1f2328">From work item to lesson learned</text>
  <text x="600" y="91" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#57606a">Each specialist leaves a durable handoff for the next stage</text>

  <g fill="none" stroke="#57606a" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M250 205 H328"/>
    <path d="M535 205 H613"/>
    <path d="M820 205 H898"/>
    <path d="M1005 257 V348"/>
    <path d="M900 405 H822"/>
    <path d="M615 405 H537"/>
    <path d="M330 405 H252"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" filter="url(#shadow)">
    <g>
      <rect x="45" y="150" width="205" height="110" rx="18" fill="url(#start)"/>
      <circle cx="76" cy="174" r="16" fill="#ffffff" fill-opacity=".2"/>
      <text x="76" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text>
      <text x="148" y="207" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">Research</text>
      <text x="148" y="235" text-anchor="middle" font-size="17" fill="#dbeafe">Understand the work</text>
    </g>

    <g>
      <rect x="330" y="150" width="205" height="110" rx="18" fill="#ffffff" stroke="#54aeff" stroke-width="3"/>
      <circle cx="361" cy="174" r="16" fill="#ddf4ff"/>
      <text x="361" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#0969da">2</text>
      <text x="433" y="207" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2328">Plan</text>
      <text x="433" y="235" text-anchor="middle" font-size="17" fill="#57606a">Choose an approach</text>
    </g>

    <g>
      <rect x="615" y="150" width="205" height="110" rx="18" fill="#ffffff" stroke="#a371f7" stroke-width="3"/>
      <circle cx="646" cy="174" r="16" fill="#fbefff"/>
      <text x="646" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#8250df">3</text>
      <text x="718" y="207" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2328">Review</text>
      <text x="718" y="235" text-anchor="middle" font-size="17" fill="#57606a">Challenge the plan</text>
    </g>

    <g>
      <rect x="900" y="150" width="205" height="110" rx="18" fill="#ffffff" stroke="#2da44e" stroke-width="3"/>
      <circle cx="931" cy="174" r="16" fill="#dafbe1"/>
      <text x="931" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#1a7f37">4</text>
      <text x="1003" y="207" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2328">Implement</text>
      <text x="1003" y="235" text-anchor="middle" font-size="17" fill="#57606a">Write the change</text>
    </g>

    <g>
      <rect x="900" y="350" width="205" height="110" rx="18" fill="#ffffff" stroke="#2da44e" stroke-width="3"/>
      <circle cx="931" cy="374" r="16" fill="#dafbe1"/>
      <text x="931" y="380" text-anchor="middle" font-size="15" font-weight="700" fill="#1a7f37">5</text>
      <text x="1003" y="407" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2328">Validate</text>
      <text x="1003" y="435" text-anchor="middle" font-size="17" fill="#57606a">Prove it works</text>
    </g>

    <g>
      <rect x="615" y="350" width="205" height="110" rx="18" fill="#ffffff" stroke="#54aeff" stroke-width="3"/>
      <circle cx="646" cy="374" r="16" fill="#ddf4ff"/>
      <text x="646" y="380" text-anchor="middle" font-size="15" font-weight="700" fill="#0969da">6</text>
      <text x="718" y="407" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2328">Pull Request</text>
      <text x="718" y="435" text-anchor="middle" font-size="17" fill="#57606a">Package the result</text>
    </g>

    <g>
      <rect x="330" y="350" width="205" height="110" rx="18" fill="#ffffff" stroke="#fb8f44" stroke-width="3"/>
      <circle cx="361" cy="374" r="16" fill="#fff1e5"/>
      <text x="361" y="380" text-anchor="middle" font-size="15" font-weight="700" fill="#bc4c00">7</text>
      <text x="433" y="407" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2328">Build Watch</text>
      <text x="433" y="435" text-anchor="middle" font-size="17" fill="#57606a">Follow CI to the end</text>
    </g>

    <g>
      <rect x="45" y="350" width="205" height="110" rx="18" fill="#ffffff" stroke="#a371f7" stroke-width="3"/>
      <circle cx="76" cy="374" r="16" fill="#fbefff"/>
      <text x="76" y="380" text-anchor="middle" font-size="15" font-weight="700" fill="#8250df">8</text>
      <text x="148" y="407" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2328">Post-Mortem</text>
      <text x="148" y="435" text-anchor="middle" font-size="17" fill="#57606a">Capture the lesson</text>
    </g>
  </g>

  <path d="M148 460 V511 H600" fill="none" stroke="#8250df" stroke-width="3" stroke-dasharray="8 8"/>
  <rect x="470" y="492" width="260" height="70" rx="35" fill="#fbefff" stroke="#a371f7" stroke-width="2"/>
  <text x="600" y="520" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#6639ba">APPROVED LESSONS</text>
  <text x="600" y="545" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#57606a">become memory for the next run</text>
</svg>
